# Dev local — volumes et logs demo. Prod : docker-compose.prod.yml sur EC2.
services:
  backend:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    ports:
      - "8020:8020"
    env_file: .env
    environment:
      LOCAL_LOGS_DIR: /data/sample_logs
    volumes:
      - ./database:/app/database
      - ./data/sample_logs:/data/sample_logs:ro
    restart: unless-stopped

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8020
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
